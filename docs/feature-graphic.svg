<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="800" cy="250" r="200" fill="#38bdf8" opacity="0.05"/>
  <circle cx="850" cy="200" r="120" fill="#34d399" opacity="0.05"/>

  <!-- Click cursor icon -->
  <g transform="translate(620, 80) scale(5)">
    <path d="M46,30v30l8.5,-8.5 5.5,13 4,-2 -5.5,-13H70L46,30z" fill="url(#accent)" opacity="0.8"/>
  </g>

  <!-- Ripple rings -->
  <circle cx="780" cy="230" r="80" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
  <circle cx="780" cy="230" r="120" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.1"/>
  <circle cx="780" cy="230" r="160" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.05"/>

  <!-- Text -->
  <text x="80" y="180" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="72" fill="#f1f5f9">Auto Clicker</text>
  <text x="80" y="240" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#94a3b8">Automatic Tap &amp; Gesture Automation</text>

  <!-- Feature pills -->
  <rect x="80" y="280" width="160" height="40" rx="20" fill="#38bdf8" opacity="0.15"/>
  <text x="160" y="306" text-anchor="middle" font-family="Arial" font-size="16" fill="#38bdf8">Single &amp; Multi Tap</text>

  <rect x="260" y="280" width="160" height="40" rx="20" fill="#34d399" opacity="0.15"/>
  <text x="340" y="306" text-anchor="middle" font-family="Arial" font-size="16" fill="#34d399">Pattern Shapes</text>

  <rect x="440" y="280" width="170" height="40" rx="20" fill="#f59e0b" opacity="0.15"/>
  <text x="525" y="306" text-anchor="middle" font-family="Arial" font-size="16" fill="#f59e0b">Gesture Recording</text>

  <rect x="80" y="340" width="160" height="40" rx="20" fill="#a78bfa" opacity="0.15"/>
  <text x="160" y="366" text-anchor="middle" font-family="Arial" font-size="16" fill="#a78bfa">Anti-Detection</text>

  <rect x="260" y="340" width="170" height="40" rx="20" fill="#fb7185" opacity="0.15"/>
  <text x="345" y="366" text-anchor="middle" font-family="Arial" font-size="16" fill="#fb7185">Volume Trigger</text>

  <!-- Bottom tagline -->
  <text x="80" y="440" font-family="Arial" font-size="20" fill="#64748b">No root required. Free. Works with any app.</text>
</svg>
