<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Clicker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; padding: 40px; }
        h1 { font-size: 42px; margin-bottom: 12px; background: linear-gradient(135deg, #38bdf8, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { font-size: 18px; color: #94a3b8; margin-bottom: 32px; max-width: 500px; }
        .links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        a { display: inline-block; padding: 12px 28px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 15px; }
        .primary { background: #38bdf8; color: #0f172a; }
        .secondary { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
        a:hover { opacity: 0.9; }
    </style>
</head>
<body>
<div class="container">
    <h1>Auto Clicker</h1>
    <p>Automatic tap, swipe & gesture automation for Android. Single tap, multi-point, pattern shapes, gesture recording, and anti-detection built in.</p>
    <div class="links">
        <a href="https://play.google.com/store/apps/details?id=com.autoclicker.claude" class="primary">Get on Google Play</a>
        <a href="privacy-policy.html" class="secondary">Privacy Policy</a>
    </div>
</div>
</body>
</html>
