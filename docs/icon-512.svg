<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Inner circle -->
  <circle cx="256" cy="240" r="140" fill="url(#accent)" opacity="0.15"/>
  <!-- Cursor/click icon (scaled) -->
  <g transform="translate(140, 100) scale(3.5)">
    <path d="M46,30v30l8.5,-8.5 5.5,13 4,-2 -5.5,-13H70L46,30z" fill="url(#accent)"/>
  </g>
  <!-- Ripple rings -->
  <circle cx="300" cy="220" r="60" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
  <circle cx="300" cy="220" r="90" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.15"/>
  <!-- App name -->
  <text x="256" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="48" fill="#e2e8f0">AUTO</text>
  <text x="256" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="36" fill="#38bdf8">CLICKER</text>
</svg>
