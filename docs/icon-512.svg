<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1120"/>
      <stop offset="100%" style="stop-color:#0D1F3C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Soft glow behind cursor -->
  <circle cx="256" cy="235" r="160" fill="url(#glow)"/>

  <!-- Outer ripple ring -->
  <circle cx="256" cy="235" r="130" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.12"/>
  <!-- Middle ripple ring -->
  <circle cx="256" cy="235" r="98" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.2"/>
  <!-- Inner ripple ring -->
  <circle cx="256" cy="235" r="65" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.3"/>

  <!-- Glow circle -->
  <circle cx="256" cy="235" r="46" fill="#38BDF8" opacity="0.12"/>

  <!-- Cursor body -->
  <path d="M218,130 L218,270 L257,228 L285,333 L310,323 L282,218 L333,218 Z" fill="#0EA5E9"/>
  <!-- Cursor left edge highlight -->
  <path d="M218,130 L218,270 L236,252 L236,152 Z" fill="#38BDF8"/>
  <!-- Cursor tip highlight -->
  <path d="M218,130 L228,148 L236,152 Z" fill="#7DD3FC"/>

  <!-- Click dot (green) -->
  <circle cx="256" cy="235" r="14" fill="#34D399"/>
  <circle cx="252" cy="231" r="5" fill="#6EE7B7"/>

  <!-- Decorative dots -->
  <circle cx="170" cy="175" r="5" fill="#38BDF8" opacity="0.15"/>
  <circle cx="342" cy="295" r="5" fill="#38BDF8" opacity="0.15"/>
  <circle cx="325" cy="160" r="3.5" fill="#38BDF8" opacity="0.1"/>
  <circle cx="178" cy="310" r="3.5" fill="#38BDF8" opacity="0.1"/>
</svg>
